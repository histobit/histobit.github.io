name: Update candles and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh completed daily candles
        run: python scripts/update_data.py
      - name: Save updated candles in this repository
        run: |
          git add candles.json eth-candles.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update daily BTCUSDT and ETHUSDT candles'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js candles.json eth-candles.json _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
